[package]
name = "docpine"
version = "0.1.0"
description = "Docpine — SQL & NoSQL Workspace Database Management Tool"
authors = ["Docpine Team"]
edition = "2021"

[lib]
name = "docpine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"
thiserror = "2.0"
uuid = { version = "1.13", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
urlencoding = "2.1"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = "3.6"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
deadpool-postgres = "0.14"
postgres-native-tls = "0.5"
native-tls = "0.2"
mysql_async = { version = "0.34", default-features = false, features = ["default-rustls"] }
mongodb = "3.2"
bson = { version = "2.13", features = ["chrono-0_4"] }
ssh2 = "0.9"
csv = "1.3"
dirs = "6.0"
futures = "0.3"
